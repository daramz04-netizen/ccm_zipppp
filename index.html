<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찬양 곡 노트</title>
<style>
:root{--bg:#f6f6f4;--card:#ffffff;--ink:#1f2328;--sub:#6b7280;--line:#e7e7e3;--acc:#24272b;--accInk:#ffffff;--chip:#f0f0ed;--soft:#fafaf8;
--c1:#f3d98b;--c2:#f1b9a4;--c3:#bcd9a3;--c4:#f0b4c6;--c5:#a9cce6;--c6:#a9dccf;--c7:#cdbdea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161718;--card:#1f2123;--ink:#ececea;--sub:#9a9ea4;--line:#2f3235;--acc:#ececea;--accInk:#161718;--chip:#2a2c2f;--soft:#1b1c1e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161718;--card:#1f2123;--ink:#ececea;--sub:#9a9ea4;--line:#2f3235;--acc:#ececea;--accInk:#161718;--chip:#2a2c2f;--soft:#1b1c1e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 70px}
h1{font-size:1.45rem;margin:0;letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--sub);font-size:.88rem}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--accInk);border:1px solid var(--acc);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.ghost:hover{background:var(--chip)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=url],select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--sub)}
.tools input{flex:1;min-width:160px;width:auto}.tools select{width:auto}
.chiprow{display:flex;gap:8px;align-items:flex-start;margin-bottom:18px}
.chiprow>.chip{flex:none;border-style:dashed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:700}
.chip small{opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.title{font-weight:800;font-size:1.04rem;word-break:keep-all}
.key{background:var(--chip);color:var(--ink);border-radius:8px;padding:2px 9px;font-weight:800;font-size:.88rem;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.76rem;padding:2px 9px;border-radius:999px;color:#2b2b2b;font-weight:600}
.lyric{color:var(--sub);font-size:.9rem;border-left:3px solid var(--line);padding-left:8px;word-break:keep-all}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.acts a{text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:50px 10px;border:1px dashed var(--line);border-radius:14px;background:var(--card)}
.ov{position:fixed;inset:0;background:rgba(15,16,18,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:20}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:520px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.modal.wide{max-width:900px}
.modal h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 5px}
.pick{display:flex;gap:7px;flex-wrap:wrap}
.pick .chip{user-select:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{height:70px;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs b{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-size:.8rem}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.sheet img{width:100%;border-radius:8px;margin-bottom:10px;background:#fff;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:9px 16px;border-radius:10px;display:none;z-index:30;font-size:.9rem}
.banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;line-height:1.7}
.banner input{width:150px;padding:6px 10px}
.pill{background:#d64545;color:#fff;border-radius:999px;padding:0 8px;font-size:.78rem;margin-left:6px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow small{color:var(--sub);display:block}
.kh{display:flex;align-items:center;gap:8px;margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kh .key{font-size:1.05rem}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.sc img{width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;background:#fff;border:1px solid var(--line)}
.st{font-weight:700;font-size:.9rem;word-break:keep-all}
.sc small{color:var(--sub)}
.addbox{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.addbox .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.addbox select{width:auto}.addbox input[type=text]{flex:1;min-width:140px;width:auto}
textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;font:inherit;resize:vertical;outline:none;color:inherit}
textarea:focus{border-color:var(--sub)}
.ctlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.ct{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.ct.on{border-color:var(--acc);background:var(--chip)}
.num{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.ct.on .num{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.ct .mid{flex:1;min-width:0}
.ct .t{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct small{color:var(--sub)}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:.7rem;padding:0 7px;cursor:pointer}
input[type=password]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🎶 찬양 곡 노트</h1><div class="sub" id="count"></div></div>
    <button class="btn" id="add" style="display:none">+ 곡 등록</button>
  </div>
  <div class="nav"><button class="btn sm" id="ct">📝 콘티 만들기</button><button class="btn ghost sm" id="lib">📁 악보 보관함</button><button class="btn ghost sm" id="shr">🔗 앱 공유</button><button class="btn ghost sm" id="lo" style="display:none">로그아웃</button><button class="btn ghost sm" id="mng" style="display:none">👥 멤버 관리<span class="pill" id="pend" style="display:none"></span></button></div>
  <div class="banner" id="banner"></div>
  <div class="tools">
    <input type="text" id="q" placeholder="제목·가사 검색">
    <select id="kf"><option value="">모든 키</option></select>
  </div>
  <div class="chiprow"><button class="chip" id="cm" style="display:none">＋ 분류 관리</button><div class="chips" id="chips"></div></div>
  <div class="grid" id="list"></div>
</div>

<div class="ov" id="formOv"><div class="modal">
  <h2 id="fh">곡 등록</h2>
  <label>CCM 제목</label><input type="text" id="fTitle" placeholder="예) 주 은혜임을">
  <label>가사 한 줄 (목록에 표시돼요)</label><input type="text" id="fLyric" maxlength="80" placeholder="예) 내 영혼이 주를 찬양해">
  <label>음원 유튜브 링크</label><input type="url" id="fYt" placeholder="https://youtu.be/...">
  <label>음원 키</label><select id="fKey"></select>
  <label>가사 묵상 분류 (여러 개 선택 가능)</label><div class="pick" id="fCats"></div>
  <label>악보 (이미지, 여러 장 가능)</label>
  <input type="file" id="fFile" accept="image/*" multiple>
  <div class="thumbs" id="fThumbs"></div>
  <div class="foot"><button class="btn ghost" id="cancel">취소</button><button class="btn" id="save">저장</button></div>
</div></div>

<div class="ov" id="ctOv"><div class="modal wide">
  <div class="row"><h2>📝 콘티 만들기</h2><button class="btn sm ghost" id="ctClose">닫기</button></div>
  <label>콘티명</label><input type="text" id="ctName" maxlength="40" placeholder="예) 11월 마지막 주일 예배 콘티">
  <label>주제 · 설교 말씀 내용</label><textarea id="ctTopic" rows="4" placeholder="예) 주제: 감사 / 본문: 시 100편 / 설교 요약…"></textarea>
  <label>곡 선택 <span class="sub" id="ctCount"></span></label>
  <div class="ctlist" id="ctList"></div>
  <div class="foot"><button class="btn ghost" id="ctClear">선택 해제</button><button class="btn" id="ctPdf">⬇ 콘티 PDF 만들기</button></div>
</div></div>
<div class="ov" id="catOv"><div class="modal">
  <h2>🏷 분류 관리</h2>
  <div style="display:flex;gap:8px"><input type="text" id="cmName" maxlength="8" placeholder="새 분류 이름 (예: 회복)"><button class="btn" id="cmAdd">추가</button></div>
  <div id="cmList" style="margin-top:10px"></div>
  <div class="sub">분류는 팀 전체가 같이 써요. 분류를 지워도 곡에 달린 태그는 남아 있어요.</div>
  <div class="foot"><button class="btn" id="cmClose">닫기</button></div>
</div></div>
<div class="ov" id="libOv"><div class="modal wide">
  <div class="row"><h2>📁 악보 보관함</h2><button class="btn sm ghost" id="libClose">닫기</button></div>
  <div class="addbox" id="libAdd" style="display:none">
    <div class="r"><b>악보 첨부</b><select id="lKey"></select><input type="text" id="lTitle" list="songList" maxlength="40" placeholder="곡 제목 (선택)"><datalist id="songList"></datalist></div>
    <div class="r"><input type="file" id="lFile" accept="image/*" multiple><button class="btn sm" id="lSave">보관함에 저장</button></div>
    <div class="thumbs" id="lThumbs"></div>
  </div>
  <div class="chips" id="libChips"></div>
  <div id="libBody"></div>
</div></div>
<div class="ov" id="sheetOv"><div class="modal sheet">
  <h2 id="sh"></h2><div class="nav" id="dlBar"><button class="btn sm" id="dlPdf">⬇ PDF로 저장</button><button class="btn sm ghost" id="dlImg">⬇ 이미지로 저장</button></div><div id="sImgs"></div>
  <div class="foot"><button class="btn" id="sClose">닫기</button></div>
</div></div>

<div class="ov" id="mngOv"><div class="modal">
  <h2>멤버 관리</h2><div id="mBody"></div>
  <div class="foot"><button class="btn" id="mClose">닫기</button></div>
</div></div>
<div class="ov" id="shOv"><div class="modal">
  <h2>앱 공유하기</h2>
  <div class="sub">아래 링크를 팀 인도자에게 보내 주세요. 링크를 받은 사람은 이메일로 가입·로그인한 뒤, 앱 안에서 이름을 적어 수정 권한을 요청하면 돼요.</div>
  <label>공유 링크</label><input type="text" id="shLink" readonly>
    <div class="foot"><button class="btn ghost" id="shClose">닫기</button><button class="btn" id="shCopy">링크 복사</button></div>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var CATS=[{n:'찬송',c:'--c1'},{n:'고백',c:'--c2'},{n:'감사',c:'--c3'},{n:'사랑',c:'--c4'},{n:'공동체',c:'--c5'},{n:'동행',c:'--c6'},{n:'믿음',c:'--c7'}];
var KEYS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var ALLKEYS=KEYS.concat(KEYS.map(function(k){return k+'m'}));
var $=function(i){return document.getElementById(i)};
var db=null,user=null,assets=null,myId=null,isOwner=false,ready=false;
var songs=[],members={},requests={},myReq=null,names={};
var cat='',editId=null,fCats=[],fImgs=[],armed=null;
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function catColor(n){var c=CATS.filter(function(x){return x.n===n})[0];return c?(c.c.charAt(0)==='#'?c.c:'var('+c.c+')'):'var(--line)'}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:''}
function canWrite(){return !!db&&(isOwner||!!members[myId])}
function nm(id){return names[id]||'이름 없음'}

function banner(){
  var b=$('banner'),h='';
  if(!db){h=needCfg?'⚙ <b>서버 설정이 필요해요.</b> index.html 위쪽 CFG에 Supabase 주소와 키를 넣어 주세요.':ready?'🔐 <b>로그인이 필요해요.</b> 이메일과 비밀번호(6자 이상)로 가입하거나 로그인해 주세요.<br><input type="text" id="aEmail" placeholder="이메일" style="width:210px"> <input type="password" id="aPw" placeholder="비밀번호" style="width:150px"> <button class="btn sm" id="aIn">로그인</button> <button class="btn sm ghost" id="aUp">가입</button>':'불러오는 중…'}
  else if(isOwner){h='👑 <b>관리자</b>입니다. 요청이 오면 “멤버 관리”에서 수락해 주세요.'}
  else if(members[myId]){h='✅ <b>공동작업자</b> · 곡을 등록·수정할 수 있어요.'}
  else if(myReq){h='⏳ 수정 권한 <b>승인 대기 중</b>이에요. 관리자가 수락하면 곡을 등록할 수 있어요.'}
  else{h='👀 지금은 <b>보기 전용</b>이에요. <br><small>관리자가 확인할 수 있게 실명과 소속을 적어 주세요.</small><br><input type="text" id="rName" maxlength="20" placeholder="이름 (필수, 예: 홍길동)"> <input type="text" id="rMemo" maxlength="40" placeholder="소속·역할 (예: 청년부 인도자)" style="width:210px"> <button class="btn sm" id="rBtn">수정 권한 요청</button>'}
  var ls=localSongs();if(canWrite()&&ls.length)h+=' <button class="btn sm" id="impBtn">이 기기에 저장된 곡 '+ls.length+'곡 가져오기</button>';
  b.innerHTML=h;
  var rb=$('rBtn');if(rb)rb.onclick=sendReq;
  var ib=$('impBtn');if(ib)ib.onclick=importLocal;
  var ai=$('aIn');if(ai){ai.onclick=function(){doAuth(false)};$('aUp').onclick=function(){doAuth(true)}}
  $('add').style.display=canWrite()?'':'none';
  $('mng').style.display=isOwner?'':'none';$('cm').style.display=canWrite()?'':'none';
  var n=Object.keys(requests).length;$('pend').style.display=(isOwner&&n)?'':'none';$('pend').textContent=n;
}
function localSongs(){try{if(localStorage.getItem('worshipSongs.v1.done'))return[];return JSON.parse(localStorage.getItem('worshipSongs.v1')||'[]')}catch(e){return[]}}
function toBlob(d){var p=d.split(','),m=/:(.*?);/.exec(p[0]),b=atob(p[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:m?m[1]:'image/jpeg'})}
var importing=false;
async function importLocal(){
  if(importing)return;importing=true;toast('가져오는 중…');
  var ls=localSongs(),ok=0,skip=0;
  for(var i=0;i<ls.length;i++){var s=ls[i],urls=[];
    for(var j=0;j<(s.imgs||[]).length;j++){var d=s.imgs[j];
      if(/^data:/.test(d)){if(!assets){skip++;continue}try{var r=await assets.upload(toBlob(d));urls.push(r.url)}catch(e){skip++}}else urls.push(d)}
    try{await db.doc('songs/'+s.id).set({title:s.title||'',lyric:s.lyric||'',yt:s.yt||'',key:s.key||'C',cats:s.cats||[],imgs:urls,at:Date.now()-i});ok++}catch(e){}
  }
  importing=false;
  if(ok===ls.length){try{localStorage.setItem('worshipSongs.v1.done','1')}catch(e){}}
  toast(ok+'곡을 가져왔어요'+(skip?' (악보 '+skip+'장 제외)':''));render();
}
function sendReq(){
  var n=$('rName').value.trim();if(!n){toast('이름을 입력해 주세요');return}
  db.doc('requests/'+myId).set({note:n,memo:($('rMemo').value||'').trim(),at:Date.now()}).then(function(){toast('요청을 보냈어요')},function(){toast('요청을 보내지 못했어요')});
}
function resolveNames(ids){
  if(!user||!ids.length)return Promise.resolve();
  return user.profiles(ids).then(function(p){ids.forEach(function(i){if(p[i]&&p[i].name)names[i]=p[i].name})}).catch(function(){});
}
function mngRender(){
  var rq=Object.keys(requests),mb=Object.keys(members),h='<label>수락 대기</label>';
  h+=rq.length?rq.map(function(id){return '<div class="mrow"><div><b>'+esc(requests[id].note||'')+'</b><small>'+esc(requests[id].memo||'')+' · 계정: '+esc(nm(id))+' · '+new Date(requests[id].at||0).toLocaleDateString('ko-KR')+'</small></div><div><button class="btn sm" data-ok="'+id+'">수락</button> <button class="btn sm ghost" data-no="'+id+'">거절</button></div></div>'}).join(''):'<div class="sub">대기 중인 요청이 없어요.</div>';
  h+='<label>공동작업자</label>';
  h+=mb.length?mb.map(function(id){return '<div class="mrow"><div><b>'+esc(members[id].note||'')+'</b><small>'+esc(members[id].memo||'')+' · 계정: '+esc(nm(id))+'</small></div><button class="btn sm ghost" data-rm="'+id+'">권한 해제</button></div>'}).join(''):'<div class="sub">아직 없어요.</div>';
  $('mBody').innerHTML=h;

var CFG={url:'여기에_SUPABASE_URL',key:'여기에_ANON_KEY'};
var sb=null,myEmail='',needCfg=false,LS=[];
function pull(){if(!sb)return Promise.resolve();
  return sb.from('docs').select('path,data').then(function(r){if(r.error)return;var m={};(r.data||[]).forEach(function(x){m[x.path]=x.data});LS.forEach(function(l){l(m)})})}
function mkDb(){
  function wr(p){return p.then(function(r){if(r&&r.error)throw r.error;return pull()})}
  function doc(path){return{
    set:function(d){return wr(sb.from('docs').upsert({path:path,data:d,updated_at:new Date().toISOString()}))},
    delete:function(){return wr(sb.from('docs').delete().eq('path',path))},
    onSnapshot:function(cb){var last;LS.push(function(m){var v=m[path],j=JSON.stringify(v===undefined?null:v);if(j===last)return;last=j;cb({exists:v!==undefined,data:function(){return v}})})}}}
  function col(name,fld){return{
    orderBy:function(f){return col(name,f)},
    onSnapshot:function(cb){var last;LS.push(function(m){var rows=[];
      Object.keys(m).forEach(function(k){if(k.indexOf(name+'/')===0)rows.push({id:k.slice(name.length+1),v:m[k]})});
      if(fld)rows.sort(function(a,b){return (b.v[fld]||0)-(a.v[fld]||0)});
      var j=JSON.stringify(rows);if(j===last)return;last=j;
      cb({docs:rows.map(function(r){return{id:r.id,data:function(){return r.v}}})})})}}}
  return{doc:doc,collection:function(n){return col(n,null)}}}
function mkAssets(){return{upload:function(blob){
  var n=(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2))+'.jpg';
  return sb.storage.from('sheets').upload(n,blob,{contentType:'image/jpeg'}).then(function(r){if(r.error)throw r.error;return{url:sb.storage.from('sheets').getPublicUrl(n).data.publicUrl}})}}}
function mkDl(){return{save:function(o){var b=(o.data instanceof Blob)?o.data:new Blob([o.data]),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);return Promise.resolve()}}}
function mkUser(){return{profiles:function(ids){return sb.from('profiles').select('id,email').in('id',ids).then(function(r){var o={};(r.data||[]).forEach(function(x){o[x.id]={name:x.email}});return o})}}}
async function doAuth(signup){
  var e=$('aEmail').value.trim(),p=$('aPw').value;
  if(!e||p.length<6){toast('이메일과 비밀번호(6자 이상)를 입력해 주세요');return}
  var r=signup?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){toast(r.error.message);return}
  if(!r.data.session){toast('확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요');return}
  location.reload()}
$('lo').onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
(async function(){
  if(CFG.url.indexOf('http')!==0||!window.supabase){needCfg=true;ready=true;render();return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  var ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
  if(ses){
    myId=ses.user.id;myEmail=ses.user.email||'';db=mkDb();assets=mkAssets();downloads=mkDl();user=mkUser();
    try{var r=await sb.rpc('is_admin');isOwner=!!r.data}catch(e){}
    $('lo').style.display='';$('lo').textContent='로그아웃 · '+myEmail;
    setTimeout(function(){pull();setInterval(pull,5000)},300);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
  }
  ready=true;render();if(!db||!myId)return;
  var t=setTimeout(function(){toast('불러오기가 오래 걸려요')},10000);
  db.collection('songs').orderBy('at','desc').onSnapshot(function(s){clearTimeout(t);
    songs=(s.docs||[]).map(function(d){var x=d.data();return{id:d.id,title:x.title||'',lyric:x.lyric||'',yt:x.yt||'',key:x.key||'C',cats:x.cats||[],imgs:x.imgs||[],at:x.at||0}});render()},function(){toast('곡 목록을 불러오지 못했어요')});
  db.collection('members').onSnapshot(function(s){members=mapDocs(s);render()},function(){});
  db.doc('settings/cats').onSnapshot(function(s){var d=s.exists?s.data():null,l=d&&d.list;
    if(l&&l.length){CATS=l.filter(function(c){return c&&typeof c.n==='string'&&typeof c.c==='string'})}
    if(cat&&!CATS.some(function(c){return c.n===cat}))cat='';
    render();if($('catOv').classList.contains('show'))cmRender()},function(){});
  db.collection('sheets').orderBy('at','desc').onSnapshot(function(s){sheets=(s.docs||[]).map(function(d){var x=d.data();return{id:d.id,title:x.title||'',key:x.key||'C',imgs:x.imgs||[],at:x.at||0}});if($('libOv').classList.contains('show'))libRender()},function(){toast('악보 보관함을 불러오지 못했어요')});
  db.doc('requests/'+myId).onSnapshot(function(s){myReq=s.exists?s.data():null;render()},function(){});
  if(isOwner)db.collection('requests').onSnapshot(function(s){requests=mapDocs(s);
    resolveNames(Object.keys(requests).concat(Object.keys(members))).then(function(){render();if($('mngOv').classList.contains('show'))mngRender()})},function(){});
})();
</script>
</body>
</html>
